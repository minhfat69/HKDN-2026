<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FutureSushi - Lễ tân</title>
  <style>
    :root { --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --primary:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --line:#334155; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; justify-content:space-between; align-items:center; padding:.8rem 1.2rem; background:#0f172a; color:#fff; }
    header h1 { font-size:1.1rem; margin:0; }
    header button { background:#334155; color:#fff; border:0; padding:.45rem .9rem; border-radius:8px; cursor:pointer; }
    main { display:grid; grid-template-columns: 1.1fr 1fr; gap:1rem; padding:1rem; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem; }
    h2 { margin:0 0 .8rem; font-size:1rem; }
    .legend { display:flex; gap:.8rem; flex-wrap:wrap; font-size:.8rem; color:var(--muted); margin-bottom:.7rem; }
    .dot { display:inline-block; width:.7rem; height:.7rem; border-radius:50%; margin-right:.3rem; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap:.6rem; }
    .tbl { border-radius:12px; padding:.7rem; color:#fff; cursor:pointer; text-align:center; border:0; font:inherit; }
    .tbl b { font-size:1.2rem; display:block; }
    .tbl small { opacity:.9; }
    .AVAILABLE { background:#16a34a; } .BOOKED { background:#2563eb; } .OCCUPIED { background:#d97706; } .CLEANING { background:#7c3aed; }
    .tbl.pick { outline:3px solid #fff; box-shadow:0 0 0 3px var(--primary); }
    form { display:grid; grid-template-columns: 1fr 1fr 90px; gap:.5rem; margin-bottom:.8rem; }
    form input, form button { padding:.55rem .7rem; border-radius:8px; border:1px solid var(--line); font:inherit; background:var(--card); color:var(--text); }
    form input.wide { grid-column: 1 / -1; }
    form button { grid-column: 1 / -1; background:var(--primary); color:#fff; border:0; font-weight:700; cursor:pointer; }
    .item { border:1px solid var(--line); border-radius:12px; padding:.7rem; margin-bottom:.6rem; }
    .item .top { display:flex; justify-content:space-between; gap:.5rem; }
    .pill { font-size:.72rem; padding:.15rem .5rem; border-radius:99px; background:var(--line); }
    .pill.NOTIFIED { background:#fde68a; color:#78350f; }
    .meta { color:var(--muted); font-size:.82rem; margin:.3rem 0; }
    .actions { display:flex; gap:.4rem; flex-wrap:wrap; }
    .actions button { padding:.35rem .7rem; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font:inherit; font-size:.82rem; }
    .actions .ok { background:#16a34a; color:#fff; border:0; }
    .actions .danger { color:#dc2626; }
    .empty { color:var(--muted); font-size:.9rem; padding:.5rem 0; }
    #toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:.6rem 1rem; border-radius:10px; display:none; max-width:90vw; }
  </style>
</head>
<body>
  <header>
    <h1>FutureSushi · Lễ tân <span id="who" style="font-weight:400;opacity:.8"></span></h1>
    <button id="logout">Đăng xuất</button>
  </header>
  <main>
    <div style="display:grid;gap:1rem;align-content:start">
      <section>
        <h2>Sơ đồ bàn <small id="pickHint" style="font-weight:400;color:var(--muted)"></small></h2>
        <div class="legend">
          <span><i class="dot" style="background:#16a34a"></i>Trống</span>
          <span><i class="dot" style="background:#2563eb"></i>Đã đặt</span>
          <span><i class="dot" style="background:#d97706"></i>Đang dùng</span>
          <span><i class="dot" style="background:#7c3aed"></i>Đang dọn</span>
        </div>
        <div class="grid" id="tables"></div>
        <p class="meta">Bấm vào bàn <b>Đang dọn</b> để chuyển thành <b>Trống</b>. Khi báo khách trong hàng chờ, chọn một bàn trống rồi bấm "Xếp bàn".</p>
      </section>
      <section>
        <h2>Đặt bàn sắp tới</h2>
        <div id="reservations"></div>
      </section>
    </div>
    <section>
      <h2>Hàng chờ (khách vãng lai)</h2>
      <form id="wlForm">
        <input name="guestName" placeholder="Tên khách" required />
        <input name="guestPhone" placeholder="Số điện thoại" required />
        <input name="partySize" type="number" min="1" max="50" value="2" title="Số khách" required />
        <input name="note" class="wide" placeholder="Ghi chú (tuỳ chọn)" />
        <button type="submit">Thêm vào hàng chờ</button>
      </form>
      <div id="waitlist"></div>
    </section>
  </main>
  <div id="toast"></div>
  <script src="./host.js"></script>
</body>
</html>
