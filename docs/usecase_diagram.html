<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .diagram-scroll {
      overflow: auto;
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    svg text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #111111;
      user-select: none;
    }
    .uc-oval {
      fill: #ffffff;
      stroke: #111111;
      stroke-width: 1.5;
      filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.12));
      transition: fill 0.15s ease, stroke-width 0.15s ease;
      cursor: pointer;
    }
    .uc-oval:hover {
      fill: #f8fafc;
      stroke-width: 2.2;
    }
    .uc-oval.new-uc {
      stroke-width: 1.7;
    }
    .highlight-new .uc-oval.new-uc {
      fill: #fef9c3;
      stroke: #ca8a04;
      stroke-width: 2.2;
    }
  </style>
</head>

  <!-- Thanh công cụ -->

    <div>
      <h1 class="text-base font-bold text-[var(--foreground)]">
        Sơ đồ Use Case cập nhật (Chuẩn UML truyền thống giống ảnh gốc)

      <p class="text-xs text-[var(--muted-foreground)] mt-0.5">
        Đã loại bỏ thanh toán Thẻ (chỉ giữ Tiền mặt, QR &amp; Chuyển khoản PayOS) và bổ sung đầy đủ 5 phân hệ: Guest/Customer, Host (Lễ tân), Staff/Thu ngân, Kitchen (KDS) &amp; Admin ERP.
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button id="btnToggleNew" onclick="toggleHighlightNew()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 cursor-pointer">
        ✨ Tô màu các Use Case mới / sửa đổi
      </button>
      <button onclick="zoomDiagram(-0.15)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-80 cursor-pointer">
        ➖ Thu nhỏ
      </button>
      <button onclick="zoomDiagram(0)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-80 cursor-pointer">
        100%

      <button onclick="zoomDiagram(0.15)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-80 cursor-pointer">

  <script>
    let currentZoom = 1;
    function zoomDiagram(delta) {
      const svg = document.getElementById('usecaseSvg');
      if (delta === 0) {
        currentZoom = 1;
      } else {
        currentZoom = Math.min(2.2, Math.max(0.6, currentZoom + delta));
      }
      svg.style.width = (currentZoom * 100) + '%';
      svg.style.minWidth = (currentZoom * 1280) + 'px';
    }

    function toggleHighlightNew() {
      const wrapper = document.getElementById('diagramWrapper');
      wrapper.classList.toggle('highlight-new');
    }

    function downloadSVG() {
      const svgEl = document.getElementById('usecaseSvg');
      const clone = svgEl.cloneNode(true);
      // Inline styles for standalone SVG export
      const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      style.textContent = `
        text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
        .uc-oval { fill: #ffffff; stroke: #111111; stroke-width: 1.5; filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.12)); }
      `;
      clone.insertBefore(style, clone.firstChild);
      const xml = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'UseCase_Diagram_FutureSushi_Updated.svg';
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadPNG() {
      const svgEl = document.getElementById('usecaseSvg');
      const clone = svgEl.cloneNode(true);
      clone.setAttribute('width', '2880');
      clone.setAttribute('height', '2085');
      const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      style.textContent = `
        text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
        .uc-oval { fill: #ffffff; stroke: #111111; stroke-width: 1.6; }
      `;
      clone.insertBefore(style, clone.firstChild);
      const xml = new XMLSerializer().serializeToString(clone);
      const svg64 = btoa(unescape(encodeURIComponent(xml)));
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = 2880;
        canvas.height = 2085;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'UseCase_Diagram_FutureSushi_Updated.png';
        a.click();
      };
      img.src = 'data:image/svg+xml;base64,' + svg64;
    }
  </script>
