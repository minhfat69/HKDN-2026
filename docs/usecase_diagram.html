<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Use Case Diagram – Hệ Thống Đặt Bàn, Gọi Món Bằng QR Và Quản Lý Nhà Hàng</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .diagram-scroll {
      overflow: auto;
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    svg text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #111111;
      user-select: none;
    }
    .uc-oval {
      fill: #ffffff;
      stroke: #111111;
      stroke-width: 1.5;
      filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.12));
      transition: fill 0.15s ease, stroke-width 0.15s ease;
      cursor: pointer;
    }
    .uc-oval:hover {
      fill: #f8fafc;
      stroke-width: 2.2;
    }
    .highlight-inv .uc-oval.inv-uc {
      fill: #dcfce7;
      stroke: #15803d;
      stroke-width: 2.3;
    }
    .highlight-new .uc-oval.new-uc {
      fill: #fef9c3;
      stroke: #ca8a04;
      stroke-width: 2.2;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-4">
  <!-- Thanh công cụ -->
  <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 mb-4 flex flex-wrap items-center justify-between gap-3 shadow-sm">
    <div>
      <h1 class="text-base font-bold text-[var(--foreground)]">
        Sơ đồ Use Case Đầy Đủ 5 Phân Hệ + Cụm Quản Lý Kho (Inventory) Chi Tiết
      </h1>
      <p class="text-xs text-[var(--muted-foreground)] mt-0.5">
        Tách riêng 1. Guest, 2. Customer (kế thừa Guest), 3. Host, 4. Staff (Phục vụ / Bếp / Thu ngân), 5. Admin + Cụm Kho (Barcode, MFG/EXP, Recipe tự động trừ kho) &amp; Thanh toán Tiền mặt / QR / Chuyển khoản.
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button onclick="toggleHighlightInventory()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-green-600 text-green-700 bg-green-50 hover:bg-green-100 cursor-pointer">
        📦 Làm nổi bật cụm Tồn Kho (Inventory)

      <button onclick="toggleHighlightNew()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 cursor-pointer">
        ✨ Tô màu tất cả Use Case mới
      </button>
      <button onclick="zoomDiagram(-0.15)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-80 cursor-pointer">
        ➖
      </button>
      <button onclick="zoomDiagram(0)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-80 cursor-pointer">
        100%
      </button>
      <button onclick="zoomDiagram(0.15)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-80 cursor-pointer">
        ➕
      </button>
      <button onclick="downloadPNG()" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white hover:bg-blue-700 cursor-pointer shadow-sm">
        📥 Tải ảnh PNG nét cao (Chèn Word)

      <button onclick="downloadSVG()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-blue-600 text-blue-600 bg-white hover:bg-blue-50 cursor-pointer">

  <script>
    let currentZoom = 1;
    function zoomDiagram(delta) {
      const svg = document.getElementById('usecaseSvg');
      if (delta === 0) {
        currentZoom = 1;
      } else {
        currentZoom = Math.min(2.2, Math.max(0.6, currentZoom + delta));
      }
      svg.style.width = (currentZoom * 100) + '%';
      svg.style.minWidth = (currentZoom * 1340) + 'px';
    }

    function toggleHighlightInventory() {
      const wrapper = document.getElementById('diagramWrapper');
      wrapper.classList.toggle('highlight-inv');
    }

    function toggleHighlightNew() {
      const wrapper = document.getElementById('diagramWrapper');
      wrapper.classList.toggle('highlight-new');
    }

    function downloadSVG() {
      const svgEl = document.getElementById('usecaseSvg');
      const clone = svgEl.cloneNode(true);
      const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      style.textContent = `
        text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
        .uc-oval { fill: #ffffff; stroke: #111111; stroke-width: 1.5; filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.12)); }
      `;
      clone.insertBefore(style, clone.firstChild);
      const xml = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'UseCase_Diagram_FutureSushi_Full5Subsystems.svg';
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadPNG() {
      const svgEl = document.getElementById('usecaseSvg');
      const clone = svgEl.cloneNode(true);
      clone.setAttribute('width', '3030');
      clone.setAttribute('height', '2250');
      const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      style.textContent = `
        text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
        .uc-oval { fill: #ffffff; stroke: #111111; stroke-width: 1.6; }
      `;
      clone.insertBefore(style, clone.firstChild);
      const xml = new XMLSerializer().serializeToString(clone);
      const svg64 = btoa(unescape(encodeURIComponent(xml)));
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = 3030;
        canvas.height = 2250;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'UseCase_Diagram_FutureSushi_Full5Subsystems.png';
        a.click();
      };
      img.src = 'data:image/svg+xml;base64,' + svg64;
    }
  </script>
